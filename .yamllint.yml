---
extends: default

ignore: |
  .venv/
  greenbone-community-ansible/

rules:
  line-length:
    max: 160
    level: warning
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ['true', 'false']
  comments-indentation: disable
