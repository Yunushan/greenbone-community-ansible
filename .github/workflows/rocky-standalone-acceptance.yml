---
name: rocky-standalone-acceptance

'on':
  workflow_dispatch:
    inputs:
      runner_label:
        description: GitHub Actions runner label that can SSH to both Rocky hosts.
        required: true

permissions:
  contents: read

concurrency:
  group: rocky-standalone-acceptance
  cancel-in-progress: false

jobs:
  rocky-standalone-acceptance:
    name: Rocky 9/10 standalone acceptance
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 180
    env:
      ROCKY9_HOST: ${{ secrets.ROCKY9_HOST }}
      ROCKY10_HOST: ${{ secrets.ROCKY10_HOST }}
      ROCKY_SSH_USER: ${{ secrets.ROCKY_SSH_USER }}
      ROCKY_SSH_PRIVATE_KEY: ${{ secrets.ROCKY_SSH_PRIVATE_KEY }}
      ROCKY_BECOME_PASSWORD: ${{ secrets.ROCKY_BECOME_PASSWORD }}
      ROCKY_SSH_KNOWN_HOSTS: ${{ secrets.ROCKY_SSH_KNOWN_HOSTS }}
      ROCKY_SSH_PORT: ${{ vars.ROCKY_SSH_PORT || '22' }}
      ACCEPTANCE_INVENTORY: inventories/rocky-standalone/hosts.acceptance.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clear previous Rocky local artifacts
        run: |
          rm -rf .secrets/rocky-standalone-evidence
          rm -rf .secrets/rocky-standalone-diagnostics

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate acceptance inputs
        shell: bash
        run: |
          missing=0
          for name in ROCKY9_HOST ROCKY10_HOST ROCKY_SSH_USER ROCKY_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret ${name}"
              missing=1
            fi
          done
          if ! [[ "${ROCKY_SSH_PORT}" =~ ^[0-9]+$ ]] || [ "${ROCKY_SSH_PORT}" -lt 1 ] || [ "${ROCKY_SSH_PORT}" -gt 65535 ]; then
            echo "::error::ROCKY_SSH_PORT must be an integer between 1 and 65535"
            missing=1
          fi
          if [ -n "${ROCKY9_HOST}" ] && [ "${ROCKY9_HOST}" = "${ROCKY10_HOST}" ]; then
            echo "::error::ROCKY9_HOST and ROCKY10_HOST must be different hosts"
            missing=1
          fi
          if [ -n "${ROCKY_BECOME_PASSWORD}" ]; then
            echo "::add-mask::${ROCKY_BECOME_PASSWORD}"
          fi
          exit "${missing}"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Configure SSH for Rocky hosts
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${ROCKY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${ROCKY_SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${ROCKY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            : > ~/.ssh/known_hosts
            for host in "${ROCKY9_HOST}" "${ROCKY10_HOST}"; do
              if ! host_keys="$(ssh-keyscan -T 10 -p "${ROCKY_SSH_PORT}" -H "${host}")" || [ -z "${host_keys}" ]; then
                echo "::error::Failed to collect SSH host key for ${host}"
                exit 1
              fi
              printf '%s\n' "${host_keys}" >> ~/.ssh/known_hosts
            done
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::SSH known_hosts is empty"
            exit 1
          fi
          if ! ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::SSH known_hosts does not contain valid host keys"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Render acceptance inventory
        run: python3 scripts/dev/Render-RockyAcceptanceInventory.py --output "${ACCEPTANCE_INVENTORY}"

      - name: Show acceptance inventory hosts
        run: ansible-inventory -i "${ACCEPTANCE_INVENTORY}" --graph

      - name: Verify Rocky SSH and sudo access
        run: >-
          ansible greenbone_masters
          -i "${ACCEPTANCE_INVENTORY}"
          -m ansible.builtin.raw
          -a 'id -u && test -r /etc/os-release'
          --become

      - name: Verify Rocky acceptance hosts are clean
        shell: bash
        run: |
          ansible greenbone_masters \
            -i "${ACCEPTANCE_INVENTORY}" \
            -m ansible.builtin.raw \
            -a 'set -eu
          if [ -e /opt/greenbone-community ]; then
            echo "Rocky acceptance hosts must be clean; /opt/greenbone-community already exists."
            exit 1
          fi
          if command -v docker >/dev/null 2>&1; then
            docker_name_format="$(printf "{%s}" "{.Names}")"
            compose_project_label="com.docker.compose.project=greenbone-community"
            greenbone_service_pattern="(gsa|gsad|gvmd|nginx|openvas|openvasd|ospd-openvas|pg-gvm|redis-server)"
            greenbone_container_pattern="^((greenbone-community[-_])?${greenbone_service_pattern}([-_][0-9]+)?)$"
            existing="$(docker ps -a --filter "label=${compose_project_label}" --format "${docker_name_format}")"
            if [ -z "${existing}" ]; then
              existing="$(
                docker ps -a --format "${docker_name_format}" |
                grep -E "${greenbone_container_pattern}" || true
              )"
            fi
            if [ -n "${existing}" ]; then
              echo "Rocky acceptance hosts must be clean; Greenbone containers already exist: ${existing}"
              exit 1
            fi
          fi' \
            --become

      - name: Run Rocky standalone preflight
        run: ansible-playbook -i "${ACCEPTANCE_INVENTORY}" playbooks/preflight-rocky-standalone.yml

      - name: Install Greenbone on Rocky standalone hosts
        run: ansible-playbook -i "${ACCEPTANCE_INVENTORY}" site.yml

      - name: Validate Rocky standalone hosts
        run: ansible-playbook -i "${ACCEPTANCE_INVENTORY}" playbooks/validate-rocky-standalone.yml

      - name: Validate Rocky acceptance evidence
        run: >-
          python3 scripts/dev/Test-RockyAcceptanceEvidence.py
          --max-age-hours 24
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Collect Rocky diagnostics on failure
        if: failure()
        continue-on-error: true
        run: ansible-playbook -i "${ACCEPTANCE_INVENTORY}" playbooks/collect-rocky-standalone-diagnostics.yml

      - name: Upload Rocky diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rocky-standalone-diagnostics
          path: .secrets/rocky-standalone-diagnostics/*.json
          if-no-files-found: warn

      - name: Upload Rocky acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rocky-standalone-evidence
          path: .secrets/rocky-standalone-evidence/*.json
          if-no-files-found: warn
