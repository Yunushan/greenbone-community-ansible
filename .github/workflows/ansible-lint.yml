---
name: ansible-lint

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run support matrix validation
        shell: pwsh
        run: |
          ./scripts/dev/Test-SupportMatrix.ps1
          ./scripts/dev/Test-RockyStandaloneSupport.ps1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml

      - name: Run Rocky standalone Ansible syntax validation
        run: |
          ansible-playbook -i inventories/rocky-standalone/hosts.yml playbooks/bootstrap-rocky-standalone.yml --syntax-check
          ansible-playbook -i inventories/rocky-standalone/hosts.yml playbooks/preflight-rocky-standalone.yml --syntax-check
          ansible-playbook -i inventories/rocky-standalone/hosts.yml site.yml --syntax-check
          ansible-playbook -i inventories/rocky-standalone/hosts.yml playbooks/validate-rocky-standalone.yml --syntax-check
          ansible-playbook -i inventories/rocky-standalone/hosts.yml playbooks/collect-rocky-standalone-diagnostics.yml --syntax-check
          ansible-playbook -i inventories/rocky-standalone/hosts.yml site.yml --list-hosts

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run yamllint
        run: yamllint .

  rocky-standalone-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Rocky RPM repository metadata validation
        run: python3 scripts/dev/Test-RockyDockerRepoMetadata.py

      - name: Run Greenbone container platform validation
        run: python3 scripts/dev/Test-GreenboneContainerPlatforms.py

      - name: Run Rocky acceptance evidence validation self-test
        run: python3 scripts/dev/Test-RockyAcceptanceEvidence.py --self-test

      - name: Run Rocky acceptance inventory renderer self-test
        run: python3 scripts/dev/Render-RockyAcceptanceInventory.py --self-test

      - name: Validate Rocky local acceptance runner shell
        run: |
          bash -n scripts/dev/Run-RockyStandaloneAcceptance.sh
          bash scripts/dev/Run-RockyStandaloneAcceptance.sh --self-test

      - name: Run Rocky acceptance workflow shell validation
        run: python3 scripts/dev/Test-RockyAcceptanceWorkflowShell.py

      - name: Run Rocky acceptance readiness checker self-test
        run: python3 scripts/dev/Test-RockyAcceptanceReadiness.py --self-test

      - name: Run Rocky Docker repository smoke validation
        run: bash scripts/dev/Test-RockyDockerRepo.sh
