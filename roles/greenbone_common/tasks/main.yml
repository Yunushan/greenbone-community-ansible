---
- name: Normalize distribution name
  ansible.builtin.set_fact:
    greenbone_distribution_normalized: "{{ ansible_distribution | lower | regex_replace('[^a-z0-9]', '') }}"

- name: Assert supported distribution
  ansible.builtin.assert:
    that:
      - greenbone_distribution_normalized in greenbone_supported_distributions_normalized
    fail_msg: >-
      Unsupported distribution '{{ ansible_distribution }}'. Supported families are
      Ubuntu, Debian, Kali, RHEL, AlmaLinux, Rocky Linux, Oracle Linux and Alpine Linux.

- name: Validate requested install mode
  ansible.builtin.assert:
    that:
      - greenbone_install_mode in ['auto', 'docker', 'native']
    fail_msg: "greenbone_install_mode must be one of: auto, docker, native."

- name: Determine effective Greenbone install mode
  ansible.builtin.set_fact:
    greenbone_effective_install_mode: >-
      {{ 'native'
         if (greenbone_install_mode == 'native' or
             (greenbone_install_mode == 'auto' and greenbone_distribution_normalized in greenbone_auto_native_distributions_normalized))
         else 'docker' }}

- name: Assert Rocky Linux Docker standalone support
  ansible.builtin.assert:
    that:
      - greenbone_install_mode == 'docker'
      - greenbone_effective_install_mode == 'docker'
      - ansible_distribution_major_version | int in greenbone_rocky_docker_supported_major_versions
      - ansible_architecture in greenbone_rocky_docker_supported_architectures
      - greenbone_docker_use_official_repo | default(true) | bool
    fail_msg: >-
      Rocky Linux support is Docker-only and validated for major versions
      {{ greenbone_rocky_docker_supported_major_versions | join(', ') }}
      on architectures {{ greenbone_rocky_docker_supported_architectures | join(', ') }}.
      Use greenbone_install_mode=docker and
      greenbone_docker_use_official_repo=true on a supported Rocky Linux host.
  when: greenbone_distribution_normalized in ['rocky', 'rockylinux']

- name: Assert controller ansible-core supports Rocky Linux 10
  ansible.builtin.assert:
    that:
      - ansible_version.full is version(greenbone_rocky10_min_ansible_core_version, '>=')
    fail_msg: >-
      Rocky Linux 10 support requires ansible-core
      {{ greenbone_rocky10_min_ansible_core_version }} or newer on the
      controller so Red Hat family package tasks use a tested backend.
      Upgrade ansible-core on the controller and rerun the playbook.
  when:
    - greenbone_distribution_normalized in ['rocky', 'rockylinux']
    - ansible_distribution_major_version | int == 10

- name: Bootstrap DNF5 Python bindings when target reports DNF5
  ansible.builtin.raw: |
    set -eu
    if rpm -q python3-libdnf5 >/dev/null 2>&1; then
      echo greenbone_dnf5_bootstrap=present
    elif dnf -q list --available python3-libdnf5 >/dev/null 2>&1; then
      dnf -y install python3-libdnf5
      echo greenbone_dnf5_bootstrap=changed
    else
      echo greenbone_dnf5_bootstrap=unavailable
      exit 1
    fi
  register: greenbone_common_rocky10_dnf5_bootstrap
  changed_when: "'greenbone_dnf5_bootstrap=changed' in greenbone_common_rocky10_dnf5_bootstrap.stdout"
  when:
    - greenbone_distribution_normalized in ['rocky', 'rockylinux']
    - ansible_pkg_mgr | default('') == 'dnf5'

- name: Install common prerequisites on Debian family
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

- name: Check whether curl-minimal is installed on RedHat family
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - curl-minimal
  register: greenbone_common_curl_minimal_result
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'RedHat'

- name: Install common prerequisites on RedHat family
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - "{{ 'curl-minimal' if greenbone_common_curl_minimal_result.rc | default(1) == 0 else 'curl' }}"
      - gnupg2
      - python3
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install common prerequisites on Alpine
  community.general.apk:
    name:
      - ca-certificates
      - curl
      - python3
    state: present
    update_cache: true
  when: greenbone_distribution_normalized == 'alpine'


- name: Ensure local controller secret directory exists
  ansible.builtin.file:
    path: "{{ greenbone_controller_secret_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure Greenbone working directory exists
  ansible.builtin.file:
    path: "{{ greenbone_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Show effective installation mode
  ansible.builtin.debug:
    msg: "Greenbone install mode on {{ inventory_hostname }} is {{ greenbone_effective_install_mode }}."
