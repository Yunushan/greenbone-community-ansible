---
- name: Ensure common facts are available
  ansible.builtin.include_role:
    name: greenbone_common
  when: greenbone_effective_install_mode is not defined

- name: Install Docker engine for worker container mode
  ansible.builtin.include_role:
    name: greenbone_docker
  when: greenbone_effective_install_mode == 'docker'

- name: Install worker scanner with Docker
  ansible.builtin.include_tasks: docker.yml
  when: greenbone_effective_install_mode == 'docker'

- name: Install worker scanner natively
  ansible.builtin.include_tasks: native.yml
  when: greenbone_effective_install_mode == 'native'
